name: kokoro-fastapi-gpu
services:
  kokoro-tts:
    # image: ghcr.io/selfishpig/kokoro-fastapi-gpu:v${VERSION}
    build:
      context: ../..
      dockerfile: docker/gpu/Dockerfile.optimized
      cache_from:
        - ghcr.io/selfishpig/kokoro-fastapi-cache:gpu-amd64
      args:
        GPU_EXTRA: ${KOKORO_GPU_EXTRA:-gpu-cu128}
        CUDA_VERSION: ${KOKORO_CUDA_VERSION:-12.8.1}
    volumes:
      - ../../api:/app/api
      - ../../web:/app/web  # hot reload the web player, files are read per request
    user: "1001:1001"  # Ensure container runs as UID 1001 (appuser)
    ports:
      - "8880:8880"
    environment:
      - PYTHONPATH=/app:/app/api
      - USE_GPU=true
      - PYTHONUNBUFFERED=1
      - API_LOG_LEVEL=DEBUG
      - DOWNLOAD_MODEL=true
      # - ALLOW_DEV_UNLOAD=true
      # - ENABLE_DEBUG_ENDPOINTS=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
